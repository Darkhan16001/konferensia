<!DOCTYPE html>
<html lang="kk">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Жасыл энергия және Қазақстанның тұрақты дамуы
    </title>

    <!-- ҚАЗАҚША ҚАРІП -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>

</head>

<body>

    <!-- ПРЕЗЕНТАЦИЯ -->

    <main id="stage" tabindex="0">

        <div id="workspace">

            <div id="zoomFrame">

                <section id="slide"></section>

            </div>

        </div>

    </main>

    <!-- СЛАЙДТАР МӘЗІРІ -->

    <aside id="menu" hidden>

        <h2>GREEN ENERGY</h2>

        <p>Ғылыми конференция · 2026</p>

        <nav id="navigation"></nav>

        <button id="reset">
            Қайта бастау
        </button>

    </aside>

    <!-- БАСҚАРУ ПАНЕЛІ -->

    <footer>

        <div class="controls">

            <button id="menuButton"
                    title="Слайдтар мәзірі">☰</button>

            <button id="prev"
                    title="Алдыңғы слайд">◀</button>

            <button id="next"
                    title="Келесі слайд">▶</button>

            <button id="timer"
                    title="Таймерді бастау">
                05:00
            </button>

            <button id="notesButton"
                    title="Баяндама мәтіні">▤</button>

            <button id="sourcesButton"
                    title="Дереккөздер">ⓘ</button>

            <button id="fullscreen"
                    title="Толық экран">⛶</button>

        </div>

        <!-- МӘТІН АНИМАЦИЯСЫ -->

        <div class="writing-controls">

            <button id="showText">
                Мәтінді көрсету
            </button>

            <button id="replayText"
                    title="Қайта жазу">↻</button>

            <button id="animationToggle"
                    title="Жазылу анимациясы">✎</button>

        </div>

        <strong id="pageNumber">
            01 / 07
        </strong>

        <!-- МАСШТАБТАУ -->

        <div class="zoom-tools">

            <button id="zoomOut"
                    title="Алыстату">−</button>

            <strong id="zoomValue">100%</strong>

            <button id="zoomIn"
                    title="Жақындату">+</button>

            <input id="zoomSlider"
                   type="range"
                   min="25"
                   max="300"
                   step="5"
                   value="100"
                   aria-label="Экран масштабы">

            <button id="zoomFit">100%</button>

            <button id="zoomMax">MAX</button>

        </div>

        <time id="clock"></time>

        <div class="progress-track">
            <div id="progress"></div>
        </div>

    </footer>

    <!-- БАЯНДАМА МӘТІНІ -->

    <dialog id="notesDialog">

        <div class="dialog-header">

            <h2>Баяндама мәтіні</h2>

            <button data-close="notesDialog">×</button>

        </div>

        <p id="notesTime"></p>

        <div id="notesText"></div>

    </dialog>

    <!-- ДЕРЕККӨЗДЕР -->

    <dialog id="sourcesDialog">

        <div class="dialog-header">

            <h2>Пайдаланылған дереккөздер</h2>

            <button data-close="sourcesDialog">×</button>

        </div>

        <div id="sourcesList"></div>

    </dialog>

</body>
</html>
